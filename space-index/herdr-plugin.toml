id = "kadaliao.space-index"
name = "Space index"
description = "Show each Herdr workspace's switch number in the sidebar, so prefix+shift+1..9 has visible targets, continuing across saved machines."
version = "0.2.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Token metadata is not restored after a server restart, so repopulate it once
# the server has restored the session and its API socket is ready.
[[startup]]
command = ["python3", "sync.py"]

# Numbers are 1-based sidebar positions, so every operation that changes the
# workspace order has to re-report them.
[[events]]
on = "workspace.created"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "sync.py"]

# When the last workspace closes, Herdr creates a replacement without emitting
# workspace.created, so nothing above runs for it. Catch it on the next thing
# that happens there. Numbers already reported are skipped, so these are cheap.
[[events]]
on = "workspace.focused"
command = ["python3", "sync.py"]

[[events]]
on = "tab.created"
command = ["python3", "sync.py"]

[[events]]
on = "tab.focused"
command = ["python3", "sync.py"]

[[events]]
on = "pane.created"
command = ["python3", "sync.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "sync.py"]

# Manual escape hatch: re-reports every number and re-sends every saved
# machine its base. Bind it with, e.g.:
#   [[keys.command]]
#   key = "prefix+alt+i"
#   type = "plugin_action"
#   command = "kadaliao.space-index.refresh"
[[actions]]
id = "refresh"
title = "Refresh workspace numbers"
contexts = ["workspace"]
command = ["python3", "sync.py", "--force"]

# Invoked over `herdr --machine` by a host that saved this machine, after it
# stores where this machine's workspaces start in its window. Only renumbers
# this server's workspaces, so two hosts that save each other never call back
# and forth.
[[actions]]
id = "renumber"
title = "Renumber this machine's workspaces"
contexts = ["global"]
command = ["python3", "sync.py", "--local-only"]
